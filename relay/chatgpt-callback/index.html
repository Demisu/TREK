<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>TREK: back to your TREK</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.5 system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="message">Taking you back to your TREK…</p>
    </main>
    <script>
      // Sign in with ChatGPT for every TREK install comes back here, the one
      // address registered with the project's client id. The sign-in's state
      // is "<check>.<base64url of the address to return to>": the install
      // that started it wrote that address, and checks the whole state when
      // the browser arrives. This page only passes the answer on. The code in
      // it is of no use without the PKCE verifier, which only that install
      // holds, so a state pointing elsewhere gives nothing away.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var message = document.getElementById('message');
        function fail(text) {
          message.textContent = text;
        }
        var state = params.get('state') || '';
        var dot = state.indexOf('.');
        if (dot < 1) return fail('This page is only a stop on the way back to TREK. Start the sign-in in TREK again.');
        var back;
        try {
          var encoded = state.slice(dot + 1).replace(/-/g, '+').replace(/_/g, '/');
          back = new URL(decodeURIComponent(escape(atob(encoded))));
        } catch (e) {
          return fail('The way back to TREK could not be read. Start the sign-in in TREK again.');
        }
        var local = back.hostname === 'localhost' || back.hostname === '127.0.0.1';
        var settings = /\/settings$/.test(back.pathname) && back.searchParams.get('ai') === 'chatgpt';
        if ((back.protocol !== 'https:' && !local) || !settings) {
          return fail('This sign-in does not lead back to a TREK. Start it in TREK again.');
        }
        ['code', 'state', 'scope', 'client_id', 'error', 'error_description'].forEach(function (key) {
          var value = params.get(key);
          if (value !== null) back.searchParams.set(key, value);
        });
        window.location.replace(back.toString());
      })();
    </script>
  </body>
</html>
